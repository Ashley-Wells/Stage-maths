<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E4DAC3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15130E" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stage maths">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Stage maths</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E4DAC3;
    --surface: #F2ECDE;
    --raised: #FAF6EC;
    --line: #C6B695;
    --ink: #17120A;
    --soft: #6B6151;
    --accent: #8A5320;
    --accent-bg: #EADBBF;
    --pen: #96241B;
    --pen-bg: #E9CEC7;
    --pen-line: #C98E82;
    --r: 12px;
    --r-sm: 9px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15130E;
      --surface: #201D17;
      --raised: #2A261E;
      --line: #3B3529;
      --ink: #F1EBDC;
      --soft: #9C937F;
      --accent: #E0B76C;
      --accent-bg: #332B1C;
      --pen: #E58371;
      --pen-bg: #3A211B;
      --pen-line: #6B372C;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15130E;
    --surface: #201D17;
    --raised: #2A261E;
    --line: #3B3529;
    --ink: #F1EBDC;
    --soft: #9C937F;
    --accent: #E0B76C;
    --accent-bg: #332B1C;
    --pen: #E58371;
    --pen-bg: #3A211B;
    --pen-line: #6B372C;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Archivo, system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    font-feature-settings: "tnum" 1;
    padding: calc(18px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
    transition: background 200ms ease, color 200ms ease;
  }
  .wrap { max-width: 460px; margin: 0 auto; }

  header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .dek { font-size: 13px; color: var(--soft); margin: 1px 0 0; }
  #theme {
    margin-left: auto; flex: none;
    width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer;
    background: var(--surface); color: var(--soft);
    border: 1px solid var(--line);
    transition: transform 140ms ease, color 140ms ease, background 140ms ease;
  }
  #theme:active { transform: scale(0.92); }
  #theme svg { width: 18px; height: 18px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 14px;
    margin-bottom: 14px;
  }

  .seg { display: flex; gap: 4px; padding: 4px; background: var(--bg); border-radius: var(--r-sm); margin-bottom: 14px; }
  .seg button {
    flex: 1; font: inherit; font-size: 15px; font-weight: 500;
    padding: 9px 0; min-height: 42px; cursor: pointer;
    background: transparent; color: var(--soft);
    border: none; border-radius: var(--r-sm);
    transition: background 160ms ease, color 160ms ease;
  }
  .seg button[aria-pressed="true"] { background: var(--raised); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.14); }
  .seg button:active { transform: scale(0.98); }

  .field { display: flex; align-items: center; gap: 12px; margin-bottom: 9px; }
  .field label { font-size: 15px; color: var(--soft); flex: 1; }
  .field input {
    font: inherit; font-size: 20px; font-weight: 600; color: var(--ink);
    width: 108px; padding: 8px 12px; min-height: 44px; text-align: right;
    background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-sm);
    transition: border-color 140ms ease, box-shadow 140ms ease;
  }
  .field input::placeholder { color: var(--soft); font-weight: 400; }
  .field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
  .hint { font-size: 12.5px; color: var(--soft); margin: 0 0 12px; }
  .lead { font-size: 13px; color: var(--soft); margin: 0 0 12px; }

  .pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin: 4px 0 9px; }
  .pad button {
    font: inherit; cursor: pointer; padding: 9px 0 7px; min-height: 60px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    background: var(--raised); color: var(--ink);
    border: 1px solid var(--line); border-radius: var(--r);
    transition: transform 110ms ease, background 160ms ease, border-color 160ms ease;
  }
  .pad button .k { font-size: 20px; font-weight: 700; line-height: 1; }
  .pad button .c { font-size: 13px; font-weight: 500; color: var(--soft); line-height: 1; transition: color 160ms ease; }
  .pad button.on { border-color: var(--accent); background: var(--accent-bg); }
  .pad button.on .c { color: var(--accent); }
  .pad button.pen { color: var(--pen); border-color: var(--pen-line); }
  .pad button.pen.on { background: var(--pen-bg); border-color: var(--pen); }
  .pad button.pen.on .c { color: var(--pen); }
  .pad button:active { transform: scale(0.94); }

  .padbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tally { font-size: 13px; color: var(--soft); flex: 1 1 100%; min-width: 0; }
  .padbar button {
    font: inherit; font-size: 13px; cursor: pointer; padding: 7px 14px; min-height: 38px;
    background: transparent; color: var(--soft);
    border: 1px solid var(--line); border-radius: 999px;
    transition: transform 110ms ease, color 140ms ease, border-color 140ms ease;
  }
  .padbar button:active { transform: scale(0.95); color: var(--ink); border-color: var(--ink); }

  .hf {
    display: flex; align-items: baseline; gap: 12px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
    padding: 14px; margin-bottom: 16px;
  }
  .hf .lbl { font-size: 14px; color: var(--soft); }
  .hf .big {
    font-size: 42px; font-weight: 700; line-height: 1; letter-spacing: -0.025em;
    color: var(--accent); font-variant-numeric: tabular-nums;
  }
  .hf .note { font-size: 12px; color: var(--soft); margin-left: auto; text-align: right; max-width: 42%; }

  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 14px; margin-bottom: 7px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r);
    transition: background 220ms ease;
  }
  .row.bad { background: var(--pen-bg); border-color: var(--pen-line); }
  .row.bad .name, .row.bad .val, .row.bad .sub { color: var(--pen); }
  .row .name { font-size: 16px; font-weight: 500; }
  .row .sub { font-size: 12.5px; color: var(--soft); }
  .row .r { text-align: right; }
  .row .val { font-size: 25px; font-weight: 700; letter-spacing: -0.015em; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .row .pre { font-size: 12.5px; font-weight: 400; color: var(--soft); }
  .row.bad .pre { color: var(--pen); }

  @keyframes flash { 0% { background: var(--accent-bg); } 100% { background: inherit; } }
  .flash { animation: flash 500ms ease-out; }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.05); } 100% { transform: scale(1); } }
  .bump { animation: bump 260ms ease-out; }

  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Stage maths</h1>
      <p class="dek">What it takes to beat them</p>
    </div>
    <button id="theme" type="button" aria-label="Switch between light and dark">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
      </svg>
    </button>
  </header>

  <div class="card">
    <div class="seg" role="group" aria-label="Power factor">
      <button type="button" id="bMinor" aria-pressed="true">Minor</button>
      <button type="button" id="bMajor" aria-pressed="false">Major</button>
    </div>
    <div class="field">
      <label for="rounds">Round count</label>
      <input type="number" id="rounds" value="24" min="1" max="60" step="1" inputmode="numeric">
    </div>
    <p class="hint" id="ptsHint" style="margin:0">120 points on offer</p>
  </div>

  <div class="card">
    <p class="lead">Their run — enter what you know, the rest follows</p>
    <div class="field">
      <label for="ctime">Time called</label>
      <input type="number" id="ctime" value="18" placeholder="—" min="0" max="300" step="0.01" inputmode="decimal">
    </div>
    <div class="field">
      <label for="chfIn">Hit factor</label>
      <input type="number" id="chfIn" placeholder="—" min="0" max="30" step="0.01" inputmode="decimal">
    </div>
    <div class="field">
      <label for="cpts">Points</label>
      <input type="number" id="cpts" placeholder="clean" min="-99" max="400" step="1" inputmode="numeric">
    </div>
    <p class="hint">Starts clean — tap only what they dropped</p>
    <div class="pad" id="pad">
      <button type="button" data-k="C"><span class="k">C</span><span class="c">0</span></button>
      <button type="button" data-k="D"><span class="k">D</span><span class="c">0</span></button>
      <button type="button" data-k="M" class="pen"><span class="k">M</span><span class="c">0</span></button>
      <button type="button" data-k="N" class="pen"><span class="k">NS</span><span class="c">0</span></button>
    </div>
    <div class="padbar">
      <span class="tally" id="tally">Clean · 120 pts</span>
      <button type="button" id="undo">Undo</button>
      <button type="button" id="clear">Clear</button>
    </div>
  </div>

  <div class="hf">
    <span class="lbl">Their hit factor</span>
    <span class="big" id="chf">6.67</span>
    <span class="note" id="cnote">120 pts in 18.00s</span>
  </div>

  <p class="lead">To beat that, come in under:</p>
  <div id="targets"></div>
</div>

<script>
(function () {
  var el = function (id) { return document.getElementById(id); };
  var rounds = el('rounds'), ctime = el('ctime'), cpts = el('cpts'), chfIn = el('chfIn');
  var bMinor = el('bMinor'), bMajor = el('bMajor'), pad = el('pad');
  var major = false, lastPH = 'points', hits = [];
  var prev = {};

  var PLANS = [
    { key: 'clean', name: 'Clean', drop: 0, bad: false },
    { key: 'c', name: 'One charlie', drop: 'C', bad: false },
    { key: 'd', name: 'One delta', drop: 'D', bad: false },
    { key: 'ns', name: 'One no-shoot', drop: 10, bad: false },
    { key: 'm', name: 'One mike', drop: 15, bad: true },
    { key: 'nsm', name: 'No-shoot + mike', drop: 25, bad: true }
  ];

  var box = el('targets');
  PLANS.forEach(function (p) {
    var d = document.createElement('div');
    d.className = 'row' + (p.bad ? ' bad' : '');
    d.innerHTML = '<div><div class="name">' + p.name + '</div><div class="sub" data-f="sub"></div></div>' +
      '<div class="r"><div class="val"><span class="pre">under</span> <span data-f="val"></span></div>' +
      '<div class="sub" data-f="cost"></div></div>';
    d.id = 'row-' + p.key;
    box.appendChild(d);
  });

  function setText(node, text, key) {
    if (prev[key] === text) return;
    prev[key] = text;
    node.textContent = text;
    if (prev.ready) {
      node.classList.remove('bump');
      void node.offsetWidth;
      node.classList.add('bump');
    }
  }

  function num(input, fallback) {
    var v = parseFloat(input.value);
    return isFinite(v) ? v : fallback;
  }

  function counts() {
    var c = { C: 0, D: 0, M: 0, N: 0 };
    for (var i = 0; i < hits.length; i++) c[hits[i]]++;
    return c;
  }

  function paintPad() {
    var c = counts();
    Array.prototype.forEach.call(pad.children, function (b) {
      var k = b.getAttribute('data-k');
      b.querySelector('.c').textContent = c[k];
      b.classList.toggle('on', c[k] > 0);
    });
  }

  function update() {
    var n = Math.max(1, Math.round(num(rounds, 24)));
    var maxPts = n * 5;
    el('ptsHint').textContent = maxPts + ' points on offer';

    var dropC = major ? 1 : 2;
    var dropD = major ? 3 : 4;

    var t = num(ctime, 0), h = num(chfIn, 0);
    var hasT = ctime.value.trim() !== '' && t > 0;
    var hasH = chfIn.value.trim() !== '' && h > 0;
    var hasP = cpts.value.trim() !== '';
    var p = hasP ? num(cpts, maxPts) : maxPts;

    var thf = 0, cnote = '', solved = '';
    if (!hasT && hasH && hasP) {
      t = p / h; thf = h; solved = 'time';
    } else if (hasT && hasH && lastPH === 'hf') {
      p = Math.round(h * t); thf = h; solved = 'points';
      cpts.value = String(p);
      hits = []; paintPad();
    } else if (hasT) {
      thf = p / t; solved = 'hit factor';
      chfIn.value = thf.toFixed(2);
    }
    if (thf > 0) cnote = p + ' pts in ' + t.toFixed(2) + 's · ' + solved + ' solved';

    var c = counts();
    var down = c.C * dropC + c.D * dropD + c.M * 15 + c.N * 10;
    el('tally').textContent = solved === 'points'
      ? 'Points worked out from time and hit factor'
      : (down > 0 ? 'Down ' + down + ' · ' + (maxPts - down) + ' pts' : 'Clean · ' + maxPts + ' pts');

    if (thf <= 0) {
      setText(el('chf'), '—', 'chf');
      el('cnote').textContent = 'needs a time, or a hit factor and points';
      box.style.opacity = '0.35';
      return;
    }
    box.style.opacity = '1';
    setText(el('chf'), thf.toFixed(2), 'chf');
    el('cnote').textContent = cnote;

    PLANS.forEach(function (pl) {
      var drop = pl.drop === 'C' ? dropC : (pl.drop === 'D' ? dropD : pl.drop);
      var pts = maxPts - drop;
      var need = pts / thf;
      var row = el('row-' + pl.key);
      row.querySelector('[data-f="sub"]').textContent =
        drop === 0 ? 'all alphas · ' + pts + ' pts' : drop + ' down · ' + pts + ' pts';
      setText(row.querySelector('[data-f="val"]'), need.toFixed(2) + 's', 'v' + pl.key);
      row.querySelector('[data-f="cost"]').textContent =
        drop === 0 ? (need / n).toFixed(2) + 's per alpha' : 'costs ' + (drop / thf).toFixed(2) + 's';
    });
  }

  function syncPoints() {
    var n = Math.max(1, Math.round(num(rounds, 24)));
    var c = counts();
    var down = c.C * (major ? 1 : 2) + c.D * (major ? 3 : 4) + c.M * 15 + c.N * 10;
    cpts.value = hits.length ? String(n * 5 - down) : '';
    paintPad();
    update();
  }

  function setPF(isMajor) {
    major = isMajor;
    bMinor.setAttribute('aria-pressed', String(!isMajor));
    bMajor.setAttribute('aria-pressed', String(isMajor));
    if (hits.length) syncPoints(); else update();
  }

  bMinor.addEventListener('click', function () { setPF(false); });
  bMajor.addEventListener('click', function () { setPF(true); });

  pad.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-k]');
    if (!b) return;
    lastPH = 'points';
    hits.push(b.getAttribute('data-k'));
    syncPoints();
  });
  el('undo').addEventListener('click', function () { lastPH = 'points'; hits.pop(); syncPoints(); });
  el('clear').addEventListener('click', function () { lastPH = 'points'; hits = []; syncPoints(); });

  cpts.addEventListener('input', function () { lastPH = 'points'; hits = []; paintPad(); });
  chfIn.addEventListener('input', function () { lastPH = 'hf'; });
  [rounds, ctime, cpts, chfIn].forEach(function (i) { i.addEventListener('input', update); });

  Array.prototype.forEach.call(document.querySelectorAll('input[type=number]'), function (i) {
    function selectAll() { setTimeout(function () { try { i.select(); } catch (e) {} }, 0); }
    i.addEventListener('focus', selectAll);
    i.addEventListener('click', selectAll);
    i.addEventListener('mouseup', function (e) { e.preventDefault(); });
  });

  var SUN = '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>';
  var MOON = '<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"></path>';
  function isDark() {
    var set = document.documentElement.getAttribute('data-theme');
    if (set) return set === 'dark';
    return window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function paintTheme() { el('themeIcon').innerHTML = isDark() ? MOON : SUN; }
  el('theme').addEventListener('click', function () {
    document.documentElement.setAttribute('data-theme', isDark() ? 'light' : 'dark');
    paintTheme();
  });
  paintTheme();

  update();
  prev.ready = true;
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
